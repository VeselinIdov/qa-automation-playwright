# Shared job definition for both Playwright pipelines.
# Entry points: azure-pipelinesUI.yml, azure-pipelinesAPI.yml
#
# Env vars come from pipeline variables (or a variable group) rather than a
# committed profile — profiles/.env.* is gitignored. dotenv does not override
# values already present in the environment, so these win in CI.

parameters:
    - name: project
      type: string
      values:
          - ui
          - api
    - name: testRunTitle
      type: string
    - name: installBrowsers
      type: boolean
      default: true
    - name: nodeVersion
      type: string
      default: '22.x'

jobs:
    - job: RunPlaywrightTests
      timeoutInMinutes: 120
      pool:
          vmImage: 'ubuntu-latest'

      steps:
          - task: UseNode@1
            inputs:
                version: ${{ parameters.nodeVersion }}
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          # Quality gate — fast, and fails before burning time on a browser run
          - script: npm run lint
            displayName: 'Lint'

          - script: npm run typecheck
            displayName: 'Typecheck'

          - script: npm run format:check
            displayName: 'Check formatting'

          # API tests drive no browser, so skip the ~1 min download for that project
          - ${{ if parameters.installBrowsers }}:
                - script: npx playwright install --with-deps
                  displayName: 'Install Playwright browsers'

          - script: npx playwright test --project=${{ parameters.project }}
            displayName: 'Run Playwright ${{ parameters.project }} tests'
            env:
                CI: 'true'
                TEST_ENV: $(TEST_ENV)
                UI_URL: $(UI_URL)
                API_URL: $(API_URL)
                USER_NAME: $(USER_NAME)
                PASSWORD: $(PASSWORD)
                SECRET_KEY: $(SECRET_KEY)

          # Interprets a red run — never changes one. Skips itself if
          # ANTHROPIC_API_KEY is unset, and can't fail the build.
          - script: node .azure/scripts/triage-failures.mjs
            displayName: 'Triage Failures'
            condition: failed()
            continueOnError: true
            env:
                ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

          - script: npx allure generate allure-results --clean -o allure-report
            displayName: 'Generate Allure Report'
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            inputs:
                testResultsFiles: '**/results.xml'
                testResultsFormat: 'JUnit'
                failTaskOnFailedTests: true
                mergeTestResults: true
                testRunTitle: ${{ parameters.testRunTitle }}
            condition: succeededOrFailed()
            displayName: 'Publish Test Results'

          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: allure-report
                artifact: allure-report
                publishLocation: 'pipeline'
            condition: succeededOrFailed()
            displayName: 'Publish Allure Report'

          # Traces, screenshots and videos for failures — only exists if something failed
          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: test-results
                artifact: test-results-${{ parameters.project }}
                publishLocation: 'pipeline'
            condition: failed()
            displayName: 'Publish Failure Artifacts'
